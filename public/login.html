<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصنع السلطان - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a7ea4 0%, #0d5f7f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .logo-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: #f9f9f9;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #0a7ea4;
            background: white;
        }

        .form-input.error {
            border-color: #ef4444;
        }

        .error-text {
            font-size: 12px;
            color: #ef4444;
            margin-top: 4px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0a7ea4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #0d5f7f;
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .forgot-btn {
            width: 100%;
            padding: 12px;
            background: none;
            border: none;
            color: #0a7ea4;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            gap: 8px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider-text {
            color: #999;
            font-size: 12px;
        }

        .signup-container {
            text-align: center;
            font-size: 14px;
        }

        .signup-text {
            color: #666;
        }

        .signup-link {
            color: #0a7ea4;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .lang-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .alert {
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <button class="lang-toggle" onclick="toggleLanguage()">
        <span id="langText">English</span>
    </button>

    <div class="container">
        <div class="logo-section">
            <div class="logo-circle">🏭</div>
            <div class="logo-title" id="appTitle">مصنع السلطان</div>
            <div class="logo-subtitle" id="appSubtitle">نظام متابعة أداء المصنع</div>
        </div>

        <div class="form-card">
            <div class="alert" id="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" id="usernameLabel">اسم المستخدم</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="أدخل اسم المستخدم"
                        required
                    />
                    <div class="error-text" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" id="passwordLabel">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="أدخل كلمة المرور"
                        required
                    />
                    <div class="error-text" id="passwordError"></div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginBtnText">تسجيل الدخول</span>
                </button>
            </form>

            <button class="forgot-btn" id="forgotBtn">
                <span id="forgotText">هل نسيت كلمة المرور؟</span>
            </button>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text" id="orText">أو</div>
                <div class="divider-line"></div>
            </div>

            <div class="signup-container">
                <span class="signup-text" id="signupText">ليس لديك حساب؟</span>
                <a href="#" class="signup-link" id="signupLink">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <script>
        let isArabic = true;

        const translations = {
            ar: {
                appTitle: 'مصنع السلطان',
                appSubtitle: 'نظام متابعة أداء المصنع',
                usernameLabel: 'اسم المستخدم',
                usernamePlaceholder: 'أدخل اسم المستخدم',
                passwordLabel: 'كلمة المرور',
                passwordPlaceholder: 'أدخل كلمة المرور',
                loginBtn: 'تسجيل الدخول',
                forgotText: 'هل نسيت كلمة المرور؟',
                orText: 'أو',
                signupText: 'ليس لديك حساب؟',
                signupLink: 'إنشاء حساب جديد',
                langText: 'English',
                usernameRequired: 'اسم المستخدم مطلوب',
                passwordRequired: 'كلمة المرور مطلوبة',
                loginFailed: 'فشل تسجيل الدخول',
                error: 'خطأ',
            },
            en: {
                appTitle: 'Sultan Factory',
                appSubtitle: 'Factory Performance Monitoring System',
                usernameLabel: 'Username',
                usernamePlaceholder: 'Enter username',
                passwordLabel: 'Password',
                passwordPlaceholder: 'Enter password',
                loginBtn: 'Login',
                forgotText: 'Forgot password?',
                orText: 'or',
                signupText: "Don't have an account?",
                signupLink: 'Create new account',
                langText: 'العربية',
                usernameRequired: 'Username is required',
                passwordRequired: 'Password is required',
                loginFailed: 'Login failed',
                error: 'Error',
            }
        };

        function t(key) {
            const lang = isArabic ? 'ar' : 'en';
            return translations[lang][key] || key;
        }

        function updateUI() {
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.getElementById('appTitle').textContent = t('appTitle');
            document.getElementById('appSubtitle').textContent = t('appSubtitle');
            document.getElementById('usernameLabel').textContent = t('usernameLabel');
            document.getElementById('username').placeholder = t('usernamePlaceholder');
            document.getElementById('passwordLabel').textContent = t('passwordLabel');
            document.getElementById('password').placeholder = t('passwordPlaceholder');
            document.getElementById('loginBtnText').textContent = t('loginBtn');
            document.getElementById('forgotText').textContent = t('forgotText');
            document.getElementById('orText').textContent = t('orText');
            document.getElementById('signupText').textContent = t('signupText');
            document.getElementById('signupLink').textContent = t('signupLink');
            document.querySelector('.lang-toggle').textContent = t('langText');
        }

        function toggleLanguage() {
            isArabic = !isArabic;
            updateUI();
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const alert = document.getElementById('alert');

            // Clear previous errors
            document.getElementById('usernameError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');
            alert.classList.remove('show', 'error', 'success');

            // Validate
            let hasError = false;
            if (!username) {
                document.getElementById('usernameError').textContent = t('usernameRequired');
                document.getElementById('usernameError').classList.add('show');
                document.getElementById('username').classList.add('error');
                hasError = true;
            } else {
                document.getElementById('username').classList.remove('error');
            }

            if (!password) {
                document.getElementById('passwordError').textContent = t('passwordRequired');
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('error');
                hasError = true;
            } else {
                document.getElementById('password').classList.remove('error');
            }

            if (hasError) return;

            // Disable button and show loading
            loginBtn.disabled = true;
            const originalText = document.getElementById('loginBtnText').textContent;
            document.getElementById('loginBtnText').innerHTML = '<span class="spinner"></span>';

            try {
                // Get API base URL from window location
                const apiBase = window.location.origin.replace(/8081-/, '3000-');
                const response = await fetch(`${apiBase}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include',
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || t('loginFailed'));
                }

                if (data.user) {
                    // Save to localStorage
                    localStorage.setItem('sultan_current_user', JSON.stringify(data.user));
                    localStorage.setItem('sultan_session_id', data.user.id.toString());

                    // Show success and redirect
                    alert.textContent = 'تسجيل الدخول بنجاح...';
                    alert.classList.add('show', 'success');

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            } catch (error) {
                alert.textContent = error.message;
                alert.classList.add('show', 'error');
            } finally {
                loginBtn.disabled = false;
                document.getElementById('loginBtnText').textContent = originalText;
            }
        }

        // Initialize UI
        updateUI();

        // Handle input changes
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('username').classList.remove('error');
            document.getElementById('usernameError').classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('password').classList.remove('error');
            document.getElementById('passwordError').classList.remove('show');
        });
    </script>
</body>
</html>
